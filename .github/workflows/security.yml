name: Security & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  quality:
    name: Code Quality & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bash Scripts
        run: |
          bash -n bin/pi-sm
          bash -n .githooks/pre-push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify TypeScript / Module Load
        run: |
          node --experimental-strip-types -e '
          (async () => {
            const mod = await import("./extensions/pi-session-manager.ts");
            if (typeof mod.default !== "function") {
              throw new Error("Extension default export is not a function");
            }
            console.log("✓ Extension default export verified as function");
          })();
          '

  osv-scanner:
    name: OSV-Scanner (CVE Vulnerability Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "pnpm-lock.yaml" ]; then
            curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
            chmod +x /usr/local/bin/osv-scanner
            osv-scanner -r .
          else
            echo "Zero 3rd-party dependencies declared (no lockfiles). Skipping CVE scan."
          fi
